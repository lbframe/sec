[project]
name = "asvs-verify"
version = "5.0.0"
description = "Deterministic OWASP ASVS 5.0 requirement engine — the provable backbone of the asvs-verify Claude skill. Exposes the `asvs` command."
requires-python = ">=3.9"
# Stdlib-only on purpose: the value uv provides here is a named, zero-setup
# command (`asvs`), not dependency management. Keep this list empty.
dependencies = []

[project.scripts]
asvs = "asvs_verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the package and its bundled authoritative data (resolved at runtime via
# importlib.resources, so every command works from any working directory).
packages = ["asvs_verify"]
